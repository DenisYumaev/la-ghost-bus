# Keeps pinned action SHAs and locked Python dependencies from going stale.
# Weekly and grouped, so it opens at most one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
